{* M4-S.5.3 – Inviting initial text preview and text alignment *}
<div class="oli-lc-live-preview" aria-labelledby="oli-lc-preview-title">
    <div class="oli-lc-live-preview__heading">
        <div>
            <p class="oli-lc-configurator__eyebrow">Liveansicht</p>
            <h2 id="oli-lc-preview-title">Vorschau</h2>
        </div>
        <span class="oli-lc-configurator__preview-status" id="oli-lc-preview-status">Beispiel</span>
    </div>

    <p class="oli-lc-live-preview__hint">Die Vorschau wird während der Eingabe automatisch aktualisiert.</p>

    <div class="oli-lc-configurator__preview-stage" aria-live="polite">
        <div class="oli-lc-configurator__preview-plate">
            <div class="oli-lc-configurator__preview-text" id="oli-lc-preview-text" data-alignment="center">Dein
3D-Text</div>
        </div>
    </div>

    <dl class="oli-lc-configurator__summary">
        <div><dt>Breite</dt><dd>–</dd></div>
        <div><dt>Höhe</dt><dd>–</dd></div>
        <div><dt>Material</dt><dd>–</dd></div>
        <div><dt>Farbe</dt><dd>–</dd></div>
    </dl>
</div>
